<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Capa Butão</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/d3.min.js"></script>
    <script src="assets/geo.js"></script>
    <script src="assets/lib.js"></script>
    <script src="assets/dress.js"></script>
    <script src="assets/yakut.js"></script>
    <script src="assets/antar.js"></script>
    <script src="assets/paris.js"></script>
    <script src="assets/sing.js"></script>
    <script src="assets/bhutan.js"></script>
    <style>
      @font-face {
        font-family: "Rubik";
        font-weight: 900;
        src: url("assets/rubik-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Rubik";
        font-weight: 700;
        src: url("assets/rubik-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lilita";
        src: url("assets/lilita-one-latin-400-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2c48a;
        font-family: "Rubik", sans-serif;
      }
      #c {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #3a3a8a;
      }
      .t {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Lilita";
        color: #fff;
        -webkit-text-stroke: 16px #1f1a17;
        paint-order: stroke fill;
        text-shadow: 0 12px 0 rgba(0, 0, 0, 0.35);
        line-height: 0.98;
      }
      .y {
        color: #ffd21f;
      }
      .card {
        position: absolute;
        background: #f6efe2;
        border: 6px solid #1f1a17;
        border-radius: 24px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.3);
        text-align: center;
        color: #1f1a17;
        padding: 14px 30px 18px;
      }
      .card b {
        display: block;
        font-family: "Rubik";
        font-weight: 900;
        font-size: 92px;
        color: #c8553d;
        line-height: 1;
      }
      .card span {
        font-weight: 700;
        font-size: 34px;
      }
      .tag {
        position: absolute;
        padding: 12px 26px;
        border-radius: 40px;
        background: #c2185b;
        color: #fff;
        font-weight: 900;
        font-size: 40px;
        border: 5px solid #1f1a17;
      }
      .vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 50%,
          transparent 55%,
          rgba(40, 20, 0, 0.35) 100%
        );
      }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      (function () {
        const L = window.LIB,
          K = "#1f1a17";
        const SQ = location.hash === "#sq";
        const H = SQ ? 1080 : 1920,
          dy = SQ ? -350 : 0;
        document.body.style.height = H + "px";
        const c = document.getElementById("c");
        c.style.height = H + "px";
        const world = L.div(
          c,
          "",
          `position:absolute;left:0;top:${dy}px;width:1080px;height:1920px`,
        );
        L.svg(world, L.thimphu(1500), 0, 0, 1080, 1920, 1);
        L.p(
          world,
          {
            gid: "c1",
            style: "short",
            hair: "#1a1410",
            skin: "#d9a87a",
            gho: "#2f4f9a",
            plaid: "#e8312f",
            kera: "#f2c21b",
            bottom: "#1f1a17",
            arms: "up",
            expr: "open",
          },
          430,
          1760,
          700,
          6,
        );
        L.p(
          world,
          {
            gid: "c2",
            style: "long",
            hair: "#1a1410",
            skin: "#e0b48a",
            dress: true,
            kira: "#c2185b",
            kstripe: "#f2c21b",
            toego: "#f2c21b",
            earrings: true,
            arms: "hip",
            expr: "smile",
          },
          690,
          1760,
          650,
          6,
        );
        const ch = L.svg(world, L.chili("#3aa84a"), 130, 1050, 300, 125, 8);
        ch.style.transform = "rotate(-25deg)";
        const gg = L.svg(world, L.gauge(), 800, 1060, 260, 156, 8);
        gg.querySelector(".needle").setAttribute("transform", "rotate(72 300 320)");
        const T0 = SQ ? 34 : 250;
        L.div(
          c,
          "t",
          `top:${T0}px;font-size:${SQ ? 80 : 92}px;z-index:20`,
          `ONDE VOCÊ VAI NASCER<br/><span class="y">DESSA VEZ?</span>`,
        );
        const ry = T0 + (SQ ? 178 : 205),
          rs = SQ ? 104 : 128;
        const rb = L.div(
          c,
          "",
          `position:absolute;left:0;right:0;top:${ry}px;height:${rs * 1.05}px;z-index:20;transform:rotate(-3deg)`,
        );
        const word = (css) =>
          `<div style="position:absolute;left:0;right:0;top:0;text-align:center;padding-left:${SQ ? 130 : 160}px;font-family:Rubik;font-weight:900;font-size:${rs}px;line-height:1;letter-spacing:1px;white-space:nowrap;${css}">BUTÃO</div>`;
        rb.innerHTML =
          word(
            "color:#1f1a17;-webkit-text-stroke:26px #1f1a17;text-shadow:0 12px 0 rgba(0,0,0,.35)",
          ) +
          word(
            "background:linear-gradient(135deg,#ffd520 0 50%,#ff5a1a 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent",
          );
        const fw = SQ ? 140 : 170;
        const fl = L.svg(
          c,
          L.flagBT(10, 14, fw, fw * 0.66, { pole: fw * 0.95 }),
          SQ ? 90 : 40,
          ry - (SQ ? 14 : 20),
          fw + 30,
          fw * 1.7,
          21,
        );
        fl.style.transform = "rotate(-8deg)";
        L.div(
          c,
          "t",
          `top:${ry + rs + (SQ ? 8 : 14)}px;font-size:${SQ ? 42 : 50}px;z-index:20;-webkit-text-stroke:11px #1f1a17;transform:rotate(-3deg);white-space:nowrap`,
          "o país que mede a felicidade",
        );
        L.div(
          c,
          "card",
          `left:0;right:0;margin:0 auto;width:${SQ ? 640 : 740}px;white-space:nowrap;top:${T0 + (SQ ? 380 : 460)}px;z-index:20;transform:rotate(-3deg)`,
          `<b style="font-size:${SQ ? 80 : 96}px">0 semáforos</b><span>na capital inteira 🚦</span>`,
        );
        L.div(c, "", "position:absolute;inset:0;z-index:30", `<div class="vig"></div>`);
      })();
    </script>
  </body>
</html>
