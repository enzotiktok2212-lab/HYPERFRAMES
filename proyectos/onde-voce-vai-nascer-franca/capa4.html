<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Capa França</title>
    <script src="assets/d3.min.js"></script>
    <script src="assets/geo.js"></script>
    <script src="assets/lib.js"></script>
    <script src="assets/dress.js"></script>
    <script src="assets/yakut.js"></script>
    <script src="assets/antar.js"></script>
    <script src="assets/paris.js"></script>
    <style>
      @font-face {
        font-family: "Rubik";
        font-weight: 900;
        src: url("assets/rubik-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Rubik";
        font-weight: 700;
        src: url("assets/rubik-latin-700-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #3a2a3a;
        font-family: "Rubik", sans-serif;
      }
      #c {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .sh {
        filter: drop-shadow(0 16px 14px rgba(20, 5, 0, 0.5));
      }
      .tx {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Rubik";
        font-weight: 900;
        color: #fff;
        -webkit-text-stroke: 16px #1f1a17;
        paint-order: stroke fill;
        line-height: 0.98;
        letter-spacing: -1px;
        white-space: nowrap;
        filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.55))
          drop-shadow(0 18px 22px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      (function () {
        const L = window.LIB,
          K = "#1f1a17";
        const SQ = location.hash === "#sq";
        const H = SQ ? 1080 : 1920;
        document.body.style.height = H + "px";
        const c = document.getElementById("c");
        c.style.height = H + "px";
        // ---------- fundo (sempre largura total) ----------
        const bgL = L.div(
          c,
          "",
          `position:absolute;left:0;top:${SQ ? -560 : 0}px;width:1080px;height:1920px`,
        );
        L.seed(5);
        let b = L.gsky("cs", "#5a6aa8", "#ffb07a");
        b += `<circle cx="930" cy="150" r="110" fill="#ff8a3a" opacity=".85"/><circle cx="930" cy="150" r="170" fill="#ffb060" opacity=".25"/>`;
        b += L.clouds(3, 3, 150, 300, "#c89aa0");
        b += L.eiffel(330, 1300, 1150, { col: "#5a3826", light: true });
        b += L.haussmann(720, 1290, 420, 9, {
          wall: "#e8d4b0",
          fh: 108,
          night: true,
          shop: { name: "BOULANGERIE", col: "#1f5a3a" },
        });
        b += L.haussmann(-60, 1290, 230, 5, {
          wall: "#ead8b8",
          fh: 108,
          shop: { name: "CAFÉ", col: "#7a1c2a" },
        });
        b += L.plamp(250, 1320, 330) + L.ptree(130, 1320, 380) + L.ptree(990, 1320, 360);
        b += `<rect x="-20" y="1290" width="1120" height="700" fill="#6a6470" stroke="${K}" stroke-width="5"/>${[...Array(8)].map((_, k) => `<rect x="${k * 150 - 10}" y="1745" width="90" height="16" fill="#d8d0e0" opacity=".8"/>`).join("")}`;
        L.svg(bgL, b, 0, 0, 1080, 1920, 1);
        // raios de sol + escurecido (como a capa da Coreia)
        L.div(
          bgL,
          "",
          "position:absolute;inset:0;z-index:2;background:repeating-conic-gradient(from 0deg at 50% 38%, rgba(255,220,160,.20) 0deg 7deg, rgba(0,0,30,.10) 7deg 15deg)",
        );
        L.div(
          bgL,
          "",
          "position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 38%, rgba(255,200,120,.15), rgba(20,10,40,.45) 75%)",
        );
        // ---------- primeiro plano (escala na versão quadrada) ----------
        const s = SQ ? 0.6 : 1;
        const fg = L.div(
          c,
          "",
          `position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:5;transform-origin:540px 0;transform:translate(0,${SQ ? -78 : 0}px) scale(${s})`,
        );
        // globo com alfinete na França
        const g = L.div(
          fg,
          "sh",
          "position:absolute;left:60px;top:350px;width:380px;height:440px;z-index:6",
        );
        const sv = d3
          .select(g)
          .append("svg")
          .attr("width", 380)
          .attr("height", 440)
          .style("overflow", "visible");
        const dfs = sv.append("defs");
        const rg = dfs
          .append("radialGradient")
          .attr("id", "gl")
          .attr("cx", "35%")
          .attr("cy", "30%")
          .attr("r", "75%");
        rg.append("stop").attr("offset", "0").attr("stop-color", "#4fb0ff");
        rg.append("stop").attr("offset", "1").attr("stop-color", "#0c3a8a");
        const pr = d3
            .geoOrthographic()
            .scale(170)
            .translate([190, 260])
            .rotate([-5, -40])
            .clipAngle(90),
          pa = d3.geoPath(pr);
        sv.append("circle")
          .attr("cx", 190)
          .attr("cy", 260)
          .attr("r", 200)
          .attr("fill", "#7ac8ff")
          .attr("opacity", 0.35);
        sv.append("path")
          .attr("d", pa({ type: "Sphere" }))
          .attr("fill", "url(#gl)")
          .attr("stroke", K)
          .attr("stroke-width", 7);
        sv.append("path")
          .attr("d", pa(GEO.land110))
          .attr("fill", "#7ad86a")
          .attr("stroke", "#1e4d1c")
          .attr("stroke-width", 2);
        sv.append("path")
          .attr("d", pa(GEO.fr))
          .attr("fill", "#ff3b4a")
          .attr("stroke", K)
          .attr("stroke-width", 3);
        const pp = pr([2.35, 46.8]);
        L.div(
          fg,
          "",
          `position:absolute;left:${60 + pp[0] - 55}px;top:${350 + pp[1] - 150}px;width:110px;height:147px;z-index:7`,
          L.mapPin(),
        ).classList.add("sh");
        // bandeira grande tremulando
        const wave = (w, h) => {
          let d = `<defs><clipPath id="wv"><path d="M0 20 Q${w / 4} -10 ${w / 2} 20 T${w} 20 V${h + 20} Q${(3 * w) / 4} ${h + 50} ${w / 2} ${h + 20} T0 ${h + 20}Z"/></clipPath><linearGradient id="wsh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset=".25" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset=".75" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient></defs>`;
          d += `<g clip-path="url(#wv)"><rect width="${w / 3}" height="${h + 60}" fill="#1f3fa8"/><rect x="${w / 3}" width="${w / 3}" height="${h + 60}" fill="#fff"/><rect x="${(2 * w) / 3}" width="${w / 3}" height="${h + 60}" fill="#e8283a"/><rect width="${w}" height="${h + 60}" fill="url(#wsh)"/></g>`;
          d += `<path d="M0 20 Q${w / 4} -10 ${w / 2} 20 T${w} 20 V${h + 20} Q${(3 * w) / 4} ${h + 50} ${w / 2} ${h + 20} T0 ${h + 20}Z" fill="none" stroke="${K}" stroke-width="8"/>`;
          return d;
        };
        L.svg(
          fg,
          `<path d="M20 0 V560" stroke="${K}" stroke-width="22" stroke-linecap="round"/><path d="M20 0 V560" stroke="#8a6a4a" stroke-width="12" stroke-linecap="round"/><g transform="translate(26,20)">${wave(400, 250)}</g>`,
          560,
          150,
          440,
          600,
          6,
        ).classList.add("sh");
        // personagem grande no centro (cabeção, marinière, boina, baguete)
        const me = L.put(
          fg,
          {
            style: "boy",
            hair: "#5a3a22",
            skin: "#f6d2b0",
            top: "#ffffff",
            stripes: "#1f3a8a",
            bottom: "#1f2a4a",
            beret: "#d0202f",
            arms: "up",
            expr: "smile",
          },
          600,
          1490,
          1150,
          8,
        );
        me.classList.add("sh");
        const bg1 = L.svg(fg, L.baguette(true), 800, 250, 120, 520, 9);
        bg1.style.transform = "rotate(22deg)";
        bg1.classList.add("sh");
        // faixa vermelha com o país
        L.div(
          fg,
          "sh",
          "position:absolute;left:-30px;right:-30px;top:905px;height:150px;z-index:12;transform:rotate(-3deg);background:linear-gradient(#ff4a4a,#c8141f);border-top:7px solid #1f1a17;border-bottom:7px solid #1f1a17;display:flex;align-items:center;justify-content:center;gap:34px",
          `<svg width="160" height="104" viewBox="0 0 160 104" style="border:6px solid #1f1a17;border-radius:6px">${L.flagFR(0, 0, 160, 104)}</svg><span class="tx" style="position:static;font-size:118px;-webkit-text-stroke:14px #1f1a17">FRANÇA</span>`,
        );
        // cartão amarelo com o dado polêmico
        L.div(
          fg,
          "sh",
          "position:absolute;left:50px;top:1080px;width:560px;z-index:13;transform:rotate(-2deg);background:#ffd21f;border:8px solid #1f1a17;border-radius:30px;padding:22px 20px 26px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.35)",
          `<div style="font-weight:900;font-size:62px;color:#1f1a17;line-height:1">SALÁRIO DE</div><div class="tx" style="position:static;font-size:92px;color:#ff3b30;-webkit-text-stroke:12px #1f1a17;margin:8px 0">R$ 17 MIL</div><div style="font-weight:900;font-size:46px;color:#1f1a17;line-height:1;white-space:nowrap">NA CLASSE MÉDIA?!</div>`,
        );
        // título embaixo
        L.div(fg, "tx", "top:1430px;font-size:80px;z-index:14", "E SE VOCÊ NASCESSE");
        L.div(
          fg,
          "tx",
          "top:1525px;font-size:156px;z-index:14;color:#ffd21f;-webkit-text-stroke:20px #1f1a17",
          "EM PARIS?",
        );
        // vinheta
        L.div(
          c,
          "",
          "position:absolute;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(10,0,20,.5) 100%)",
        );
      })();
    </script>
  </body>
</html>
