<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Capa França</title>
    <script src="assets/d3.min.js"></script>
    <script src="assets/geo.js"></script>
    <script src="assets/lib.js"></script>
    <script src="assets/dress.js"></script>
    <script src="assets/yakut.js"></script>
    <script src="assets/antar.js"></script>
    <script src="assets/paris.js"></script>
    <style>
      @font-face {
        font-family: "Rubik";
        font-weight: 900;
        src: url("assets/rubik-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Lilita";
        src: url("assets/lilita-one-latin-400-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #3a2a3a;
        font-family: "Rubik", sans-serif;
      }
      #c {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .sh {
        filter: drop-shadow(0 16px 14px rgba(20, 5, 0, 0.5));
      }
      .tx {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Lilita";
        color: #fff;
        -webkit-text-stroke: 15px #1f1a17;
        paint-order: stroke fill;
        line-height: 0.98;
        letter-spacing: 2px;
        white-space: nowrap;
        filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.55))
          drop-shadow(0 18px 22px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      (function () {
        const L = window.LIB,
          K = "#1f1a17";
        const SQ = location.hash === "#sq";
        const H = SQ ? 1080 : 1920;
        document.body.style.height = H + "px";
        const c = document.getElementById("c");
        c.style.height = H + "px";
        // ---------- fundo (largura total) ----------
        const bgL = L.div(
          c,
          "",
          `position:absolute;left:0;top:${SQ ? -560 : 0}px;width:1080px;height:1920px`,
        );
        let b = L.gsky("cs", "#4a5a98", "#ffb07a");
        b += `<circle cx="900" cy="230" r="110" fill="#ff8a3a" opacity=".85"/><circle cx="900" cy="230" r="170" fill="#ffb060" opacity=".25"/>`;
        b += L.clouds(3, 3, 200, 360, "#c89aa0");
        b += L.eiffel(300, 1330, 1080, { col: "#5a3826", light: true });
        b += L.haussmann(720, 1330, 420, 8, {
          wall: "#e8d4b0",
          fh: 108,
          night: true,
          shop: { name: "BOULANGERIE", col: "#1f5a3a" },
        });
        b += L.haussmann(-60, 1330, 230, 5, {
          wall: "#ead8b8",
          fh: 108,
          shop: { name: "CAFÉ", col: "#7a1c2a" },
        });
        b += L.plamp(500, 1360, 330) + L.ptree(120, 1360, 380) + L.ptree(1000, 1360, 360);
        b += `<rect x="-20" y="1330" width="1120" height="700" fill="#6a6470" stroke="${K}" stroke-width="5"/>${[...Array(8)].map((_, k) => `<rect x="${k * 150 - 10}" y="1790" width="90" height="16" fill="#d8d0e0" opacity=".8"/>`).join("")}`;
        L.svg(bgL, b, 0, 0, 1080, 1920, 1);
        L.div(
          bgL,
          "",
          "position:absolute;inset:0;z-index:2;background:repeating-conic-gradient(from 0deg at 50% 40%, rgba(255,220,160,.20) 0deg 7deg, rgba(0,0,30,.10) 7deg 15deg)",
        );
        L.div(
          bgL,
          "",
          "position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 40%, rgba(255,200,120,.15), rgba(20,10,40,.45) 75%)",
        );
        // ---------- primeiro plano: tudo entre y≈300 e y≈1620 ----------
        const s = SQ ? 0.62 : 1;
        const fg = L.div(
          c,
          "",
          `position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:5;transform-origin:540px 0;transform:translate(0,${SQ ? -80 : 0}px) scale(${s})`,
        );
        // globo com alfinete na França
        const g = L.div(
          fg,
          "sh",
          "position:absolute;left:70px;top:330px;width:320px;height:370px;z-index:6",
        );
        const sv = d3
          .select(g)
          .append("svg")
          .attr("width", 320)
          .attr("height", 370)
          .style("overflow", "visible");
        const rg = sv
          .append("defs")
          .append("radialGradient")
          .attr("id", "gl")
          .attr("cx", "35%")
          .attr("cy", "30%")
          .attr("r", "75%");
        rg.append("stop").attr("offset", "0").attr("stop-color", "#4fb0ff");
        rg.append("stop").attr("offset", "1").attr("stop-color", "#0c3a8a");
        const pr = d3
            .geoOrthographic()
            .scale(140)
            .translate([160, 220])
            .rotate([-5, -40])
            .clipAngle(90),
          pa = d3.geoPath(pr);
        sv.append("circle")
          .attr("cx", 160)
          .attr("cy", 220)
          .attr("r", 165)
          .attr("fill", "#7ac8ff")
          .attr("opacity", 0.35);
        sv.append("path")
          .attr("d", pa({ type: "Sphere" }))
          .attr("fill", "url(#gl)")
          .attr("stroke", K)
          .attr("stroke-width", 6);
        sv.append("path")
          .attr("d", pa(GEO.land110))
          .attr("fill", "#7ad86a")
          .attr("stroke", "#1e4d1c")
          .attr("stroke-width", 2);
        sv.append("path")
          .attr("d", pa(GEO.fr))
          .attr("fill", "#ff3b4a")
          .attr("stroke", K)
          .attr("stroke-width", 3);
        const pp = pr([2.35, 46.8]);
        L.div(
          fg,
          "sh",
          `position:absolute;left:${70 + pp[0] - 46}px;top:${330 + pp[1] - 124}px;width:92px;height:123px;z-index:7`,
          L.mapPin(),
        );
        // bandeira grande tremulando
        const wave = (w, h) =>
          `<defs><clipPath id="wv"><path d="M0 20 Q${w / 4} -10 ${w / 2} 20 T${w} 20 V${h + 20} Q${(3 * w) / 4} ${h + 50} ${w / 2} ${h + 20} T0 ${h + 20}Z"/></clipPath><linearGradient id="wsh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".25" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset=".75" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient></defs><g clip-path="url(#wv)"><rect width="${w / 3}" height="${h + 60}" fill="#1f3fa8"/><rect x="${w / 3}" width="${w / 3}" height="${h + 60}" fill="#fff"/><rect x="${(2 * w) / 3}" width="${w / 3}" height="${h + 60}" fill="#e8283a"/><rect width="${w}" height="${h + 60}" fill="url(#wsh)"/></g><path d="M0 20 Q${w / 4} -10 ${w / 2} 20 T${w} 20 V${h + 20} Q${(3 * w) / 4} ${h + 50} ${w / 2} ${h + 20} T0 ${h + 20}Z" fill="none" stroke="${K}" stroke-width="8"/>`;
        L.svg(
          fg,
          `<path d="M20 0 V520" stroke="${K}" stroke-width="22" stroke-linecap="round"/><path d="M20 0 V520" stroke="#8a6a4a" stroke-width="12" stroke-linecap="round"/><g transform="translate(26,20)">${wave(340, 215)}</g>`,
          640,
          310,
          390,
          560,
          6,
        ).classList.add("sh");
        // o casal do vídeo: você (marinière + boina, baguete) e a mãe com o bebê
        const mom = L.p(
          fg,
          {
            style: "long",
            hair: "#f2d06a",
            skin: "#f6dcc0",
            dress: true,
            top: "#e8283a",
            arms: "hold",
            expr: "smile",
            earrings: true,
            bottom: "#2a3a5a",
          },
          410,
          1340,
          760,
          8,
        );
        mom.classList.add("sh");
        const bb = L.svg(fg, L.baby("#a8c8f8"), 328, 832, 168, 116, 9);
        bb.classList.add("sh");
        const me = L.p(
          fg,
          {
            style: "short",
            hair: "#5a3a22",
            skin: "#f3d7b8",
            top: "#ffffff",
            stripes: "#1f3a8a",
            bottom: "#2a3a5a",
            beret: "#c8202f",
            arms: "up",
            expr: "open",
          },
          650,
          1350,
          820,
          8,
        );
        me.classList.add("sh");
        const bg1 = L.svg(fg, L.baguette(true), 704, 380, 80, 346, 9);
        bg1.style.transform = "rotate(14deg)";
        bg1.classList.add("sh");
        // faixa vermelha com o país
        L.div(
          fg,
          "sh",
          "position:absolute;left:-30px;right:-30px;top:930px;height:128px;z-index:12;transform:rotate(-3deg);background:linear-gradient(#ff4a4a,#c8141f);border-top:7px solid #1f1a17;border-bottom:7px solid #1f1a17;display:flex;align-items:center;justify-content:center;gap:30px",
          `<svg width="138" height="90" viewBox="0 0 160 104" style="border:6px solid #1f1a17;border-radius:6px">${L.flagFR(0, 0, 160, 104)}</svg><span class="tx" style="position:static;font-size:104px;letter-spacing:4px">FRANÇA</span>`,
        );
        // cartão amarelo com o dado polêmico
        L.div(
          fg,
          "sh",
          "position:absolute;left:60px;top:1080px;width:480px;z-index:13;transform:rotate(-2deg);background:#ffd21f;border:8px solid #1f1a17;border-radius:28px;padding:18px 16px 22px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.35)",
          `<div style="font-weight:900;font-size:50px;color:#1f1a17;line-height:1">SALÁRIO DE</div><div class="tx" style="position:static;font-size:86px;color:#ff3b30;-webkit-text-stroke:11px #1f1a17;margin:6px 0">R$ 17 MIL</div><div style="font-weight:900;font-size:38px;color:#1f1a17;line-height:1;white-space:nowrap">NA CLASSE MÉDIA?!</div>`,
        );
        // título
        L.div(fg, "tx", "top:1380px;font-size:96px;z-index:14", "E SE VOCÊ NASCESSE");
        L.div(
          fg,
          "tx",
          "top:1485px;font-size:168px;z-index:14;letter-spacing:4px;-webkit-text-stroke:20px #1f1a17",
          `<span>EM </span><span style="color:#ffd21f">PA</span><span style="color:#ffb21f">RIS</span><span style="color:#ff8a1f">?</span>`,
        );
        L.div(
          c,
          "",
          "position:absolute;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(10,0,20,.45) 100%)",
        );
      })();
    </script>
  </body>
</html>
